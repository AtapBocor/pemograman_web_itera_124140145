<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kampus Planner</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div class="max-w-4xl mx-auto p-4 sm:p-8 space-y-6">

    <!-- Header -->
    <header>
      <h1 class="text-3xl font-bold text-indigo-600">Kampus Planner</h1>
      <p id="todayLabel" class="text-slate-500"></p>
    </header>

    <!-- Widget cuaca & kutipan -->
    <section class="grid gap-4 sm:grid-cols-2" aria-label="Info harian">
      <div class="bg-white rounded-xl shadow p-4">
        <h2 class="text-xs font-semibold uppercase tracking-wide text-slate-400">Cuaca Kampus ITERA</h2>
        <div id="weatherBox" class="mt-2 text-sm text-slate-500">Memuat cuaca...</div>
      </div>
      <div class="bg-white rounded-xl shadow p-4 flex flex-col">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-semibold uppercase tracking-wide text-slate-400">Kutipan Hari Ini</h2>
          <button id="quoteBtn" type="button" class="text-xs text-indigo-600 hover:underline">Kutipan lain</button>
        </div>
        <div id="quoteBox" class="mt-2 text-sm text-slate-500">Memuat kutipan...</div>
      </div>
    </section>

    <!-- Statistik -->
    <section class="bg-white rounded-xl shadow p-4" aria-label="Statistik tugas">
      <div id="statsBox" class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center"></div>
      <div class="mt-4 h-2 bg-slate-200 rounded-full overflow-hidden" role="progressbar"
           aria-label="Progres tugas selesai" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div id="progressBar" class="h-full bg-indigo-500 transition-all duration-300" style="width: 0%"></div>
      </div>
    </section>

    <!-- Form tambah / edit -->
    <section class="bg-white rounded-xl shadow p-4" aria-label="Form tugas">
      <h2 id="formTitle" class="font-semibold mb-3">Tambah Tugas</h2>
      <form id="taskForm" class="grid gap-3 sm:grid-cols-6" novalidate>
        <div class="sm:col-span-6">
          <label for="taskTitle" class="block text-xs text-slate-500 mb-1">Judul tugas</label>
          <input id="taskTitle" type="text" maxlength="120" placeholder="Contoh: Laporan praktikum Basis Data"
                 class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <div class="sm:col-span-2">
          <label for="taskCourse" class="block text-xs text-slate-500 mb-1">Mata kuliah</label>
          <input id="taskCourse" type="text" maxlength="40" placeholder="Pemrograman Web"
                 class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <div class="sm:col-span-2">
          <label for="taskDeadline" class="block text-xs text-slate-500 mb-1">Deadline</label>
          <input id="taskDeadline" type="date"
                 class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <div class="sm:col-span-2">
          <label for="taskPriority" class="block text-xs text-slate-500 mb-1">Prioritas</label>
          <select id="taskPriority"
                  class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <option value="tinggi">Tinggi</option>
            <option value="sedang" selected>Sedang</option>
            <option value="rendah">Rendah</option>
          </select>
        </div>
        <p id="formError" class="sm:col-span-6 text-sm text-red-600 hidden" role="alert"></p>
        <div class="sm:col-span-6 flex gap-2">
          <button id="submitBtn" type="submit"
                  class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-lg text-sm font-medium transition">
            Tambah Tugas
          </button>
          <button id="cancelBtn" type="button"
                  class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 px-4 rounded-lg text-sm font-medium transition">
            Batal
          </button>
        </div>
      </form>
    </section>

    <!-- Daftar tugas -->
    <section class="bg-white rounded-xl shadow p-4" aria-label="Daftar tugas">
      <div class="flex flex-wrap items-center gap-2 mb-4">
        <div id="filterBar" class="flex gap-1" role="group" aria-label="Filter status">
          <button type="button" data-filter="semua" class="filter-btn">Semua</button>
          <button type="button" data-filter="aktif" class="filter-btn">Aktif</button>
          <button type="button" data-filter="selesai" class="filter-btn">Selesai</button>
        </div>
        <input id="searchInput" type="search" placeholder="Cari tugas atau mata kuliah..." aria-label="Cari tugas"
               class="flex-1 min-w-[10rem] border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <button id="clearDoneBtn" type="button" class="text-sm text-red-600 hover:underline">Hapus yang selesai</button>
      </div>
      <ul id="taskList" class="space-y-2"></ul>
    </section>

    <footer class="text-center text-xs text-slate-400 pb-4">
      Data tersimpan di browser (localStorage). Cuaca: Open-Meteo. Kutipan: DummyJSON. Contoh awal: JSONPlaceholder.
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
